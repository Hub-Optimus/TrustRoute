<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustRoute — Wireframes v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#EAEAEA;padding:20px;min-height:100vh}

.wrapper{max-width:900px;margin:0 auto}

.header{text-align:center;margin-bottom:24px}
.header h1{font-size:20px;font-weight:600;color:#1A1A1A;letter-spacing:-.3px}
.header p{font-size:12px;color:#666;margin-top:4px}
.header .badge{display:inline-block;margin-top:8px;padding:3px 10px;background:#fff;border:1px solid #CCC;border-radius:12px;font-size:11px;color:#555}

/* nav pills */
.pill-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;background:#fff;padding:10px 12px;border-radius:10px;border:1px solid #DDD}
.pill{padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #CCC;background:#FAFAFA;color:#555;white-space:nowrap;transition:all .15s;font-weight:400}
.pill:hover{background:#F0F0F0}
.pill.active{background:#1A1A1A;color:#FFF;border-color:#1A1A1A;font-weight:500}

.screen-counter{font-size:11px;color:#888;text-align:right;margin-bottom:6px;padding-right:4px}

/* device frame */
.device{background:#FFF;border-radius:14px;border:2px solid #CCC;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}

/* annotation bar */
.annotation{background:#FFFBE6;border-top:1px solid #E8D96C;padding:10px 16px;font-size:11px;color:#6B5800;line-height:1.6}
.annotation strong{font-weight:600}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #E8E8E8;background:#FFF}
.logo{font-size:14px;font-weight:700;color:#1A1A1A;letter-spacing:-.3px}
.logo span{color:#888;font-weight:400}
.nav-links{display:flex;gap:14px;font-size:11px;color:#666}
.topbar-right{display:flex;gap:8px;align-items:center}

/* buttons */
.btn{padding:6px 14px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:500;border:1px solid transparent}
.btn-primary{background:#1A1A1A;color:#FFF;border-color:#1A1A1A}
.btn-secondary{background:#FFF;color:#1A1A1A;border-color:#CCC}
.btn-ghost{background:transparent;color:#555;border:none;font-size:12px;cursor:pointer}
.btn-full{width:100%;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#1A1A1A;color:#FFF;border:none}
.btn-success{background:#1B6B2F;color:#FFF;border:none;border-radius:7px;padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer}

/* body area */
.bd{padding:20px 20px}

/* labels */
.eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:6px}
.section-title{font-size:16px;font-weight:600;color:#1A1A1A;margin-bottom:4px}
.section-sub{font-size:12px;color:#666;margin-bottom:16px;line-height:1.5}

/* landing hero */
.hero{text-align:center;padding:28px 20px 20px}
.hero-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:#F0F0F0;color:#444;border-radius:20px;font-size:11px;margin-bottom:14px;border:1px solid #E0E0E0}
.hero h1{font-size:26px;font-weight:700;color:#1A1A1A;margin-bottom:10px;line-height:1.25;letter-spacing:-.5px}
.hero h1 em{font-style:normal;text-decoration:underline;text-decoration-color:#CCC;text-underline-offset:3px}
.hero p{font-size:12px;color:#555;margin-bottom:18px;line-height:1.65;max-width:420px;margin-left:auto;margin-right:auto}
.hero-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* quick check box on landing */
.quick-check{border:1px solid #CCC;border-radius:10px;padding:14px;margin:0 0 16px;background:#FAFAFA}
.quick-check .qc-label{font-size:11px;font-weight:600;color:#444;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.qc-input-row{display:flex;gap:8px}
.qc-input{flex:1;padding:8px 11px;border:1px solid #CCC;border-radius:7px;font-size:12px;color:#888;background:#FFF}

/* why cards (audit findings) */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.why-card{padding:12px;border:1px solid #E0E0E0;border-radius:10px;background:#FFF}
.why-card .wc-head{font-size:11px;font-weight:600;color:#1A1A1A;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.why-card .wc-head i{color:#888;font-size:13px}
.why-card p{font-size:11px;color:#666;line-height:1.5}
.why-card .wc-badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-warn{background:#FFF3CD;color:#7A4B00;border:1px solid #FACB3A}
.badge-err{background:#FDECEA;color:#8B1A1A;border:1px solid #F5A5A5}
.badge-ok{background:#E8F5E9;color:#1B6B2F;border:1px solid #A5D6A7}

/* mode cards */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mode-card{padding:14px;border:1px solid #E0E0E0;border-radius:10px;background:#FFF;cursor:pointer;transition:border-color .15s}
.mode-card:hover{border-color:#999}
.mode-card.featured{border-color:#1A1A1A;background:#FAFAFA}
.mode-card .mc-num{font-size:10px;font-weight:700;color:#888;margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase}
.mode-card .mc-icon{font-size:20px;color:#1A1A1A;margin-bottom:6px;display:block}
.mode-card h3{font-size:12px;font-weight:600;margin-bottom:4px;color:#1A1A1A}
.mode-card p{font-size:11px;color:#666;line-height:1.5}

/* sign up modal hint */
.modal-overlay{background:rgba(0,0,0,.35);position:relative;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:220px}
.modal-box{background:#FFF;border-radius:12px;padding:20px;width:100%;max-width:340px;border:1px solid #E0E0E0;margin:20px auto}
.modal-title{font-size:14px;font-weight:600;color:#1A1A1A;margin-bottom:4px}
.modal-sub{font-size:11px;color:#666;margin-bottom:14px;line-height:1.5}
.form-field{margin-bottom:10px}
.form-field label{display:block;font-size:11px;color:#555;margin-bottom:4px;font-weight:500}
.form-field input{width:100%;padding:8px 10px;border:1px solid #CCC;border-radius:7px;font-size:12px;color:#888;background:#FAFAFA}
.modal-footer{font-size:10px;color:#888;margin-top:10px;text-align:center}

/* plan mode */
.prompt-box{width:100%;min-height:64px;padding:10px 12px;border:1px solid #CCC;border-radius:8px;font-size:12px;color:#888;background:#FAFAFA;margin-bottom:10px;line-height:1.5}
.form-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin-bottom:10px;font-size:12px}
.form-row label{color:#555;font-size:11px;font-weight:500}
.fi{padding:7px 10px;border:1px solid #CCC;border-radius:7px;font-size:12px;color:#444;background:#FFF}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid #CCC;color:#555;background:#FFF}
.chip.on{background:#1A1A1A;color:#FFF;border-color:#1A1A1A}
.divider{border:none;border-top:1px solid #EBEBEB;margin:14px 0}

/* plan results */
.result-section{margin-bottom:16px}
.result-section .rs-head{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.result-section .rs-head i{font-size:14px;color:#666}
.flight-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid #E0E0E0;border-radius:8px;margin-bottom:6px;background:#FFF}
.flight-row .fr-left{font-size:12px;font-weight:500;color:#1A1A1A}
.flight-row .fr-meta{font-size:11px;color:#666}
.flight-row .fr-price{font-size:13px;font-weight:600;color:#1A1A1A}
.flight-row .fr-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#E8F5E9;color:#1B6B2F;border:1px solid #A5D6A7;font-weight:500}
.hotel-row{display:flex;align-items:flex-start;justify-content:space-between;padding:9px 12px;border:1px solid #E0E0E0;border-radius:8px;margin-bottom:6px;background:#FFF}
.hotel-row .hr-name{font-size:12px;font-weight:500;color:#1A1A1A;margin-bottom:2px}
.hotel-row .hr-meta{font-size:11px;color:#666;line-height:1.4}
.hotel-row .hr-price{font-size:13px;font-weight:600;color:#1A1A1A;text-align:right;white-space:nowrap}
.hotel-row .hr-dist{font-size:10px;color:#888;text-align:right}
.doc-box{padding:10px 12px;border:1px solid #E0E0E0;border-radius:8px;background:#FFF}
.doc-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#444;padding:4px 0;border-bottom:1px solid #F0F0F0}
.doc-item:last-child{border:none}
.doc-item i{font-size:13px;color:#1B6B2F}
.note-box{padding:10px 12px;border:1px solid #FACB3A;border-radius:8px;background:#FFFBE6;margin-top:10px;font-size:11px;color:#7A4B00;line-height:1.5}
.note-box i{margin-right:4px}

/* verify mode */
.tabs{display:flex;border-bottom:1px solid #E8E8E8;margin-bottom:14px}
.tab{padding:8px 14px;font-size:12px;color:#666;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#1A1A1A;border-bottom-color:#1A1A1A;font-weight:500}
.paste-row{display:flex;gap:8px;margin-bottom:8px}
.paste-input{flex:1;padding:8px 11px;border:1px solid #CCC;border-radius:7px;font-size:12px;color:#888;background:#FFF}
.support-text{font-size:11px;color:#888;margin-bottom:14px}
.upload-zone{border:2px dashed #CCC;border-radius:10px;padding:20px;text-align:center;color:#888;font-size:12px;margin-bottom:12px;background:#FAFAFA}
.upload-zone i{font-size:26px;display:block;margin-bottom:6px;color:#AAA}
.check-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.check-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.check-item i{font-size:13px;color:#1B6B2F}

/* verify results */
.trust-score-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;margin-bottom:14px;border:1px solid}
.ts-amber{background:#FFF8E7;border-color:#FACB3A}
.ts-green{background:#E8F5E9;border-color:#A5D6A7}
.ts-red{background:#FDECEA;border-color:#F5A5A5}
.ts-num{font-size:32px;font-weight:700}
.ts-amber .ts-num{color:#7A4B00}
.ts-green .ts-num{color:#1B6B2F}
.ts-red .ts-num{color:#8B1A1A}
.ts-label{font-size:12px;font-weight:600}
.ts-sub{font-size:11px;color:#666;margin-top:2px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.check-card{padding:10px 11px;border-radius:8px;border:1px solid}
.cc-green{background:#E8F5E9;border-color:#A5D6A7}
.cc-amber{background:#FFF8E7;border-color:#FACB3A}
.cc-red{background:#FDECEA;border-color:#F5A5A5}
.cc-head{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-bottom:4px}
.cc-green .cc-head{color:#1B6B2F}
.cc-amber .cc-head{color:#7A4B00}
.cc-red .cc-head{color:#8B1A1A}
.cc-body{font-size:10px;color:#555;line-height:1.4}
.cc-action{font-size:10px;font-weight:600;margin-top:5px;cursor:pointer}
.cc-green .cc-action{color:#1B6B2F}
.cc-amber .cc-action{color:#7A4B00}
.cc-red .cc-action{color:#8B1A1A}
.result-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* monitor dashboard */
.trip-card{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid #E0E0E0;border-radius:9px;margin-bottom:8px;background:#FFF}
.tc-left{display:flex;align-items:center;gap:10px}
.tc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tc-dot-green{background:#2E7D32}
.tc-dot-amber{background:#B45309}
.tc-dot-blue{background:#1565C0}
.tc-name{font-size:13px;font-weight:500;color:#1A1A1A}
.tc-meta{font-size:11px;color:#666;margin-top:1px}
.tc-right{display:flex;align-items:center;gap:8px}
.status-badge{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:500}
.sb-green{background:#E8F5E9;color:#1B6B2F;border:1px solid #A5D6A7}
.sb-amber{background:#FFF8E7;color:#7A4B00;border:1px solid #FACB3A}
.sb-blue{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.time-ago{font-size:10px;color:#999}
.alert-feed{margin-top:12px}
.af-item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid #F0F0F0;font-size:11px;color:#444;line-height:1.5}
.af-item:last-child{border:none}
.af-dot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex-shrink:0}
.af-dot-amber{background:#B45309}
.af-dot-green{background:#2E7D32}
.af-item strong{font-weight:600;color:#1A1A1A}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat-box{padding:10px;background:#FAFAFA;border-radius:8px;text-align:center;border:1px solid #E8E8E8}
.stat-box .sn{font-size:18px;font-weight:700;color:#1A1A1A}
.stat-box .sl{font-size:10px;color:#888;margin-top:2px}

/* alert detail */
.alert-detail-card{border:1px solid #FACB3A;background:#FFF8E7;border-radius:10px;padding:16px;margin-bottom:14px}
.adc-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.adc-head i{font-size:18px;color:#7A4B00}
.adc-head h2{font-size:14px;font-weight:600;color:#7A4B00}
.price-compare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:#FFF;border-radius:8px;margin:10px 0;border:1px solid #E8E8E8}
.pc-item{text-align:center}
.pc-item .pc-label{font-size:10px;color:#666;margin-bottom:3px}
.pc-item .pc-val{font-size:15px;font-weight:700;color:#1A1A1A}
.pc-item .pc-val.saved{color:#1B6B2F}
.adc-desc{font-size:11px;color:#555;line-height:1.6}
.adc-actions{display:flex;gap:8px;margin-top:12px}
.adc-expiry{font-size:10px;color:#7A4B00;margin-top:8px;display:flex;align-items:center;gap:4px}
.share-strip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #E0E0E0;border-radius:8px;background:#FFF}
.share-strip p{font-size:11px;color:#666}
.share-strip .ss-title{font-size:12px;font-weight:500;color:#1A1A1A;margin-bottom:2px}

/* sign up modal overlay screen */
.screen-overlay{position:relative}
.screen-overlay .bg-blur{filter:blur(1px);pointer-events:none;opacity:.5}

/* empty state */
.empty{text-align:center;padding:30px 20px;color:#888;font-size:12px}
.empty i{font-size:32px;display:block;margin-bottom:8px;color:#CCC}
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>TrustRoute — Product Wireframes</h1>
    <p>UI flow documentation · All 3 modes + Landing & Sign-up</p>
    <span class="badge">v2 · Matches live MVP at trust-route-nf9a.vercel.app</span>
  </div>

  <div class="pill-bar" id="np"></div>
  <div class="screen-counter" id="sc"></div>
  <div class="device" id="sw"></div>

</div>

<script>
const scr = [
  "1. Landing Page",
  "2. Sign-up Modal",
  "3. Plan — Input",
  "4. Plan — Results",
  "5. Verify — Input",
  "6. Verify — Results",
  "7. Monitor — Dashboard",
  "8. Monitor — Alert Detail"
];

function topbar(right=""){
  return `<div class="topbar">
    <div style="display:flex;align-items:center;gap:18px">
      <div class="logo">Trust<span>Route</span></div>
      <div class="nav-links"><span>How it works</span><span>Pricing</span><span>Blog</span></div>
    </div>
    <div class="topbar-right">${right}</div>
  </div>`;
}

const H = {

// ── 1. LANDING ──────────────────────────────────────────────────
0: topbar(`<button class="btn btn-secondary">Sign in</button><button class="btn btn-primary">Get early access</button>`) + `
<div class="bd">
  <div class="hero">
    <div class="hero-tag"><i class="ti ti-shield-check" style="font-size:12px"></i> Real findings. Real trips. Verified.</div>
    <h1>Book with confidence.<br><em>Travel without surprises.</em></h1>
    <p>The AI layer between your booking and your boarding pass. TrustRoute verifies every detail — price, hotel status, documents, amenities — before you arrive.</p>
    <div class="hero-btns">
      <button class="btn btn-primary" style="padding:9px 20px;font-size:13px">Try free — paste any booking</button>
      <button class="btn btn-secondary" style="padding:9px 18px;font-size:13px">See how it works</button>
    </div>
  </div>

  <div class="quick-check">
    <div class="qc-label"><i class="ti ti-bolt" style="font-size:13px;color:#888"></i> Quick check — paste any booking link or confirmation</div>
    <div class="qc-input-row">
      <div class="qc-input">https://booking.com/confirm/... or paste your confirmation text</div>
      <button class="btn btn-primary" style="white-space:nowrap;padding:8px 14px"><i class="ti ti-shield-check"></i> Verify now</button>
    </div>
  </div>

  <div class="eyebrow" style="margin-bottom:8px">Why TrustRoute — real findings from OTA research</div>
  <div class="why-grid">
    <div class="why-card">
      <div class="wc-head"><i class="ti ti-currency-rupee"></i> Three-price funnel</div>
      <p>MakeMyTrip showed ₹2,010 on the listing, ₹9,000 on the review page, ₹4,551 at checkout — same booking.</p>
      <span class="wc-badge badge-warn">Trust leak by design</span>
    </div>
    <div class="why-card">
      <div class="wc-head"><i class="ti ti-star"></i> Rating contradiction</div>
      <p>Booking.com rated a hotel 4.1 "Disappointing" — but every subcategory score was 4.8–5.0. Its own data disagreed.</p>
      <span class="wc-badge badge-err">Data integrity gap</span>
    </div>
    <div class="why-card">
      <div class="wc-head"><i class="ti ti-wifi-off"></i> Hidden WiFi gap</div>
      <p>Full booking flow completed — search, detail, checkout, confirmation — and nowhere was it shown the property had no internet.</p>
      <span class="wc-badge badge-err">Critical info hidden</span>
    </div>
  </div>

  <div class="eyebrow" style="margin-bottom:8px">Three modes — one platform</div>
  <div class="mode-grid">
    <div class="mode-card">
      <div class="mc-num">Mode 01</div>
      <i class="ti ti-map-2 mc-icon"></i>
      <h3>Plan</h3>
      <p>Describe your trip in plain language. TrustRoute builds a verified roadmap — flights, hotels, visa rules, documents.</p>
    </div>
    <div class="mode-card featured">
      <div class="mc-num">Mode 02</div>
      <i class="ti ti-shield-check mc-icon"></i>
      <h3>Verify</h3>
      <p>Paste any booking confirmation. We run 12 trust checks in seconds and give you a score with flagged items.</p>
    </div>
    <div class="mode-card">
      <div class="mc-num">Mode 03</div>
      <i class="ti ti-eye mc-icon"></i>
      <h3>Monitor</h3>
      <p>Silent background watch from booking to check-in. Alerts only when something changes.</p>
    </div>
  </div>
</div>`,
annotation:`<strong>Landing Page</strong> · Hero leads with the real problem (not the product). Quick-check paste box on landing means users see value before signing up. "Why" cards show real field research findings — these are actual observations from MakeMyTrip and Booking.com field study. Three mode cards introduce the product structure. CTA is "Get early access" — connects to sign-up modal.`,

// ── 2. SIGN-UP MODAL ──────────────────────────────────────────────
1: topbar(`<button class="btn btn-secondary">Sign in</button><button class="btn btn-primary">Get early access</button>`) + `
<div class="bd" style="position:relative">
  <div style="filter:blur(2px);opacity:.4;pointer-events:none">
    <div class="hero" style="padding:16px 20px 12px">
      <div class="hero-tag">Real findings. Real trips. Verified.</div>
      <h1>Book with confidence.<br>Travel without surprises.</h1>
    </div>
  </div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;max-width:340px;padding:0 16px">
    <div class="modal-box" style="margin:0">
      <div class="modal-title">Get early access to TrustRoute</div>
      <div class="modal-sub">Join 8,200+ travelers who verify before they fly. Free to start — no card required.</div>
      <div class="form-field">
        <label>Full name</label>
        <input type="text" placeholder="Your name">
      </div>
      <div class="form-field">
        <label>Email address</label>
        <input type="email" placeholder="you@example.com">
      </div>
      <div class="form-field">
        <label>How often do you travel?</label>
        <input type="text" placeholder="2–3 times a year / Monthly / etc.">

};

let cur = 0;

// Split HTML and annotations
const annotations = {};
Object.keys(H).forEach(k => {
  const val = H[k];
  if (typeof val === 'object' && val.annotation) {
    annotations[k] = val.annotation;
    H[k] = val; // keep as-is, we read .annotation separately
  }
});

function render() {
  const html = typeof H[cur] === 'string' ? H[cur] : H[cur];
  const note = annotations[cur] || H[cur].annotation || "";
  document.getElementById('sw').innerHTML =
    `<div>${html}</div>` +
    (note ? `<div class="annotation">${note}</div>` : '');
  document.getElementById('sc').textContent = `Screen ${cur + 1} of ${scr.length}`;
  document.querySelectorAll('.pill').forEach((p, i) => p.classList.toggle('active', i === cur));
}

const np = document.getElementById('np');
scr.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'pill' + (i === 0 ? ' active' : '');
  b.textContent = s;
  b.onclick = () => { cur = i; render(); };
  np.appendChild(b);
});

render();
</script>
